name: Render Deploy
on:
  workflow_run:
    workflows:
      - CI Pipeline
    types:
      - completed
jobs:
  containerization:
    runs-on: ubuntu-latest
    steps:
      - uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_PASSWORD }}
      - uses: docker/setup-buildx-action@v4
      - name: Docker build
        run: docker build -t lucasmoraessilva/api-kotlin:latest .
      - name: Docker push
        run: docker push lucasmoraessilva/api-kotlin:latest