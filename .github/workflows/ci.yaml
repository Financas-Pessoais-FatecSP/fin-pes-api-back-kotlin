name: CI Pipeline
on:
  push:
    branches:
      - main
  pull_request:
    types:
      - opened
      - synchronize
    branches:
      - main
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v6
        with:
          distribution: corretto
          java-version: 21
      - uses: gradle/actions/setup-gradle@v6
      - name: Build with Gradle
        run: gradle build
  package:
    needs:
     - build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v6
        with:
          distribution: corretto
          java-version: 21
      - uses: gradle/actions/setup-gradle@v6
      - name: Package with Gradle
        run: gradle jar
      - name: Archive app package
        uses: actions/upload-artifact@v6
        with:
          name: api
          path: build/libs/*.jar